; MyTapeStore draft — PHP runtime settings.

memory_limit = 256M
max_execution_time = 120
max_input_vars = 3000
upload_max_filesize = 64M
post_max_size = 64M

; display_errors was on in the Playground config, contradicting
; WP_DEBUG_DISPLAY=false. A real host with display_errors on will print the
; "Constant WP_DEBUG already defined" warning before headers and break redirects.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr
expose_php = Off

; The single biggest lever on a 0.5 vCPU box. WooCommerce alone is 5,872 files.
opcache.enable = 1
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
; Code is baked into an immutable image and never edited at runtime, so skip the
; stat() on every include.
opcache.validate_timestamps = 0
opcache.save_comments = 1

; Session files go to the writable data dir, not the read-only docroot.
session.save_path = /tmp
