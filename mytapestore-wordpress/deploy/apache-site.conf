# MyTapeStore draft vhost.
#
# All rewrite rules live here rather than in an .htaccess: no .htaccess exists
# anywhere in the install (Playground routed everything through its own server),
# and keeping AllowOverride None means Apache does not stat for .htaccess on
# every path segment of every request — worth real milliseconds on a 0.5 vCPU
# instance.

<VirtualHost *:80>
    ServerName localhost
    UseCanonicalName Off
    DocumentRoot /var/www/html

    # Every host in scope fronts the container with a proxy. Without this the
    # access log, and anything that rate-limits by IP, sees only the edge.
    RemoteIPHeader X-Forwarded-For

    # Belt and braces behind the auth gate: crawlers get a 401 anyway, but if
    # the gate is ever lifted for a demo, this still keeps it out of the index.
    Header always set X-Robots-Tag "noindex, nofollow, noarchive, nosnippet"
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    # Health endpoint, exempt from auth. Platform health checks expect 200, and
    # a 401 reads as a failing service — Fly would restart the machine in a loop.
    Alias /healthz /var/www/healthz
    <Location "/healthz">
        Require all granted
        Header always set Content-Type "text/plain"
    </Location>

    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride None

        # ---- the review gate -------------------------------------------------
        AuthType Basic
        AuthName "MyTapeStore — unreleased draft"
        AuthUserFile /etc/apache2/.htpasswd
        Require valid-user

        # ---- WordPress pretty permalinks (/blog/%postname%/) -----------------
        RewriteEngine On
        RewriteBase /
        RewriteRule ^index\.php$ - [L]
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule . /index.php [L]
    </Directory>

    # Uploads are a symlink into the data volume; follow it, and never execute
    # anything found in there.
    <Directory /var/www/data>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        AuthType Basic
        AuthName "MyTapeStore — unreleased draft"
        AuthUserFile /etc/apache2/.htpasswd
        Require valid-user
        php_flag engine off
    </Directory>

    # The SQLite file lives outside the docroot (DB_DIR=/var/www/data/database),
    # but deny the legacy path too in case a future build puts it back.
    <LocationMatch "^/wp-content/(database|upgrade|cache)/">
        Require all denied
    </LocationMatch>
    <FilesMatch "^\.ht|^wp-config\.php$|^\.env$">
        Require all denied
    </FilesMatch>

    # Unused on a draft store and a standing brute-force target.
    <Files "xmlrpc.php">
        Require all denied
    </Files>

    <IfModule mod_expires.c>
        ExpiresActive On
        ExpiresByType image/webp             "access plus 30 days"
        ExpiresByType image/png              "access plus 30 days"
        ExpiresByType image/jpeg             "access plus 30 days"
        ExpiresByType text/css               "access plus 7 days"
        ExpiresByType application/javascript "access plus 7 days"
        ExpiresByType font/woff2             "access plus 30 days"
    </IfModule>

    ErrorLog  /dev/stderr
    CustomLog /dev/stdout combined
    LogLevel warn
</VirtualHost>
