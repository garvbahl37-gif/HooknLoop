# Prefork tuning for a 512 MB instance.
#
# Debian's default is MaxRequestWorkers 150. With mod_php and WooCommerce each
# worker peaks around 60-90 MB, so the default lets Apache reserve ~10 GB it
# does not have; the kernel OOM-kills the container under a burst of image
# requests and the platform records it as a crash loop. Eight workers is the
# right number for 512 MB, and the reviewer is one person.
#
# Raise MaxRequestWorkers to ~24 if you move to a 2 GB instance.

<IfModule mpm_prefork_module>
    StartServers             2
    MinSpareServers          2
    MaxSpareServers          4
    MaxRequestWorkers        8
    MaxConnectionsPerChild   500
</IfModule>
