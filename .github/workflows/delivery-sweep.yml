# Marks Shopify orders Delivered from ShipStation, for both stores.
#
# WHY THIS RUNS HERE AND NOT ON A SHIPSTATION WEBHOOK
# ShipStation's `track` webhook does not fire on its own: every parcel must be
# subscribed via "Start Tracking Updates", and that endpoint answers
# `401 - You must upgrade your billing plan`. Registering the webhook returns 200
# and looks healthy while never delivering anything, which is how it went
# unnoticed for a day. The Vercel functions therefore poll, and this is what
# tells them to.
#
# Vercel's own cron also hits these endpoints, but the account is on the hobby
# plan where crons fire only once a day. This brings that down to ~15 minutes.
# Both can run: the work is idempotent, so an overlap costs two API reads.
#
# The two stores are separate businesses with separate Vercel projects, separate
# tokens and separate secrets. They are two steps here purely so one store's
# outage cannot hide the other's -- neither can write to the other's store.

name: Delivery status sweep

on:
  schedule:
    # Every 15 minutes, deliberately NOT on :00/:15/:30/:45. GitHub queues every
    # repo's on-the-hour jobs at once and drops or badly delays them; `*/15` sat
    # for over two hours here without firing once. Odd minutes miss that stampede.
    # Even so, GitHub schedules are best-effort -- read this as "usually within
    # 15-30 minutes". The Vercel daily cron is the backstop underneath it.
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch: {}

concurrency:
  # A sweep can take over a minute when a carrier is rate-limiting us. Never let
  # a slow run overlap the next one.
  group: delivery-sweep
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: My Tape Store
        env:
          SECRET: ${{ secrets.MTS_SWEEP_SECRET }}
          URL: https://mts-automation.vercel.app/api/sweep?days=30
        run: |
          code=$(curl -sS --max-time 300 -o body.json -w '%{http_code}' -H "Authorization: Bearer $SECRET" "$URL")
          echo "HTTP $code"
          cat body.json
          echo
          echo "My Tape Store: HTTP $code" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat body.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          test "$code" = "200"

      - name: HooknLoop
        # always() so a My Tape Store failure never silently skips HooknLoop.
        if: always()
        env:
          SECRET: ${{ secrets.HNL_SWEEP_SECRET }}
          URL: https://hnl-automation.vercel.app/api/sweep?days=30
        run: |
          code=$(curl -sS --max-time 300 -o body.json -w '%{http_code}' -H "Authorization: Bearer $SECRET" "$URL")
          echo "HTTP $code"
          cat body.json
          echo
          echo "HooknLoop: HTTP $code" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat body.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          test "$code" = "200"
